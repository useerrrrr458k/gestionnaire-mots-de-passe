<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestionnaire de mots de passe</title>
    <!-- Liaison du fichier CSS pour la mise en forme -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Mon gestionnaire de mots de passe</h1>
    <p>Une application pédagogique en HTML, CSS et JavaScript.</p>

    <!-- Champ pour le site -->
    <label for="site">Site :</label>
    <input type="text" id="site" placeholder="Exemple : GitHub">

    <!-- Champ pour l'identifiant -->
    <label for="identifiant">Identifiant :</label>
    <input type="text" id="identifiant" placeholder="Exemple : eleve01">

    <!-- Champ pour le mot de passe (masqué) -->
    <label for="motDePasse">Mot de passe :</label>
    <input type="password" id="motDePasse">

    <!-- Bouton pour ajouter le compte -->
    <button id="btnAjouter">Ajouter</button>

    <!-- Liaison du fichier JavaScript juste avant la fermeture du body -->
    <script src="script.js"></script>
</body>
</html>
