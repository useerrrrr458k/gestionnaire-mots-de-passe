<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestionnaire de mots de passe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Bouton Mode Sombre -->
    <button id="btnModeSombre" style="float: right;">🌙 Mode Sombre</button>

    <h1>Mon gestionnaire de mots de passe</h1>
    <p>Une application pédagogique en HTML, CSS et JavaScript.</p>

    <!-- Défi : Recherche par site -->
    <label for="recherche">Rechercher un site :</label>
    <input type="text" id="recherche" placeholder="Filtrer par site...">

    <hr>

    <!-- Formulaire d'ajout -->
    <label for="site">Site :</label>
    <input type="text" id="site" placeholder="Exemple : GitHub">
    
    <label for="identifiant">Identifiant :</label>
    <input type="text" id="identifiant" placeholder="Exemple : eleve01">
    
    <label for="motDePasse">Mot de passe :</label>
    <input type="password" id="motDePasse">

    <!-- Défi : Générateur configurable -->
    <div style="background: #eee; padding: 10px; margin-bottom: 15px; border-radius: 4px;">
        <label for="longueurMdp">Longueur du mot de passe : <span id="valLongueur">12</span></label>
        <input type="range" id="longueurMdp" min="6" max="30" value="12">
        
        <label><input type="checkbox" id="chkMaj" checked> Majuscules</label>
        <label><input type="checkbox" id="chkMin" checked> Minuscules</label>
        <label><input type="checkbox" id="chkChiffres" checked> Chiffres</label>
        <label><input type="checkbox" id="chkSpeciaux" checked> Caractères spéciaux</label>
        
        <button id="btnGenerer" style="margin-top: 10px;">Générer le mot de passe</button>
    </div>
    
    <button id="btnAjouter">Ajouter le compte</button>

    <!-- Défi : Compteur de comptes -->
    <p><strong>Nombre de comptes enregistrés :</strong> <span id="compteurComptes">0</span></p>

    <!-- Zone d'affichage de la liste -->
    <div id="listeComptes"></div>

    <script src="script.js"></script>
</body>
</html>
